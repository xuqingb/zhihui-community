# Copy to <repository>/config/application-local.yml and start with the local profile.
# Read README.md before starting: this template does not provision dependencies
# or resolve the Spring Boot / Spring AI version compatibility noted there.
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zhiguang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  ai:
    deepseek:
      api-key: ${DP_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
    openai:
      # This is DashScope's OpenAI-compatible embedding endpoint.
      # API_KEY belongs to DashScope, not to the DeepSeek chat account.
      api-key: ${API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1536
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: zhiguang-ai-index
        # Must match both the embedding output and an existing index mapping.
        dimensions: 1536

canal:
  # The current bridge does not honor enabled=false in start(); see README.
  enabled: true
  host: ${CANAL_HOST:127.0.0.1}
  port: ${CANAL_PORT:11111}
  destination: ${CANAL_DESTINATION:example}
  # Canal TCP client credentials, distinct from Canal's MySQL replication user.
  # Empty defaults assume a local Canal TCP server without client authentication.
  username: ${CANAL_USERNAME:}
  password: ${CANAL_PASSWORD:}
  filter: 'zhiguang\.outbox'
  batchSize: 1000
  intervalMs: 1000

oss:
  # Use the endpoint hostname, without an https:// prefix.
  endpoint: ${OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
  bucket: ${OSS_BUCKET}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  # Optional full origin, e.g. https://assets.example.com (without trailing slash).
  public-domain: ${OSS_PUBLIC_DOMAIN:}
  folder: avatars

auth:
  jwt:
    issuer: zhiguang
    key-id: zhiguang-local
    # Generate these files using the commands in README.md.
    private-key: file:./config/keys/private.pem
    public-key: file:./config/keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8

counter:
  rebuild:
    # Do not enable historical replay against live counters without isolation.
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

cache:
  l2:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
    mine-cfg:
      ttl-seconds: 10
      max-size: 1000
    detail-cfg:
      ttl-seconds: 30
      max-size: 5000
  hotkey:
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120
