<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">知汇系统架构</title>
  <desc id="desc">Vue 前端提供本地演示与真实接口两种模式。Spring Boot 模块化单体连接 MySQL、Redis、Elasticsearch、OSS 和 AI 服务。关系事件通过 Outbox、Canal 和 Kafka 异步更新派生数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7e9ec9"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}
      .title{font-size:32px;font-weight:700;fill:#152b49}.sub{font-size:16px;fill:#73859e}
      .label{font-size:21px;font-weight:700;fill:#173454}.body{font-size:16px;fill:#49627f}
      .small{font-size:14px;fill:#73859e}.blue{fill:#0674f9}.line{fill:none;stroke:#7e9ec9;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1020" rx="24" fill="#f5f8fd"/>
  <rect x="64" y="52" width="6" height="42" rx="3" fill="#0674f9"/>
  <text x="88" y="82" class="title">知汇 · 系统架构</text>
  <text x="88" y="112" class="sub">社区阅读与创作 / 缓存与异步事件 / 围绕单篇知文的 AI 问答</text>

  <rect x="80" y="156" width="792" height="112" rx="16" fill="#eaf3ff" stroke="#bcd7ff"/>
  <text x="110" y="194" class="label blue">Vue 3 + Vite · 响应式社区前端</text>
  <text x="110" y="224" class="body">首页 Feed　专题　Markdown 阅读与写作　收藏　关注　个人空间</text>
  <text x="110" y="249" class="small">真实模式：REST / Bearer JWT / SSE / OSS 预签名 PUT</text>
  <path d="M872 211H928" class="line" stroke-dasharray="5 5"/>
  <rect x="944" y="156" width="416" height="112" rx="16" fill="#fff" stroke="#cfddee" stroke-dasharray="6 5"/>
  <text x="968" y="194" class="label">本地演示模式</text>
  <text x="968" y="224" class="body">24 篇示例 / 本地头像 / 浏览器存储</text>
  <text x="968" y="249" class="small">游客或显式演示身份；不调用真实 AI</text>
  <path d="M476 268V316" class="line"/>
  <text x="494" y="299" class="small">/api/v1 · 默认 HTTP 8080</text>

  <rect x="80" y="332" width="1280" height="236" rx="18" fill="#fff" stroke="#cfddee"/>
  <text x="108" y="370" class="label">Spring Boot · 模块化单体</text>
  <text x="1030" y="370" class="small">Spring Security · MyBatis · Spring AI</text>
  <g fill="#f5f8fd" stroke="#dce6f3">
    <rect x="108" y="393" width="188" height="86" rx="10"/>
    <rect x="315" y="393" width="188" height="86" rx="10"/>
    <rect x="522" y="393" width="188" height="86" rx="10"/>
    <rect x="729" y="393" width="188" height="86" rx="10"/>
    <rect x="936" y="393" width="188" height="86" rx="10"/>
    <rect x="1143" y="393" width="188" height="86" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="202" y="426" class="body">认证与资料</text><text x="202" y="454" class="small">JWT 双令牌 / BCrypt</text>
    <text x="409" y="426" class="body">知文与 Feed</text><text x="409" y="454" class="small">草稿 / 发布 / 分页</text>
    <text x="616" y="426" class="body">计数与关系</text><text x="616" y="454" class="small">Bitmap / Lua / Outbox</text>
    <text x="823" y="426" class="body">内容搜索</text><text x="823" y="454" class="small">IK / search_after</text>
    <text x="1030" y="426" class="body">对象存储</text><text x="1030" y="454" class="small">OSS 预签名直传</text>
    <text x="1237" y="426" class="body">摘要与 RAG</text><text x="1237" y="454" class="small">向量检索 / SSE</text>
  </g>
  <rect x="108" y="498" width="1223" height="44" rx="8" fill="#edf5ff"/>
  <text x="719" y="526" text-anchor="middle" class="body">进程内 Caffeine · HotKey 热度识别 · 线程池 · Actuator</text>

  <g class="line"><path d="M198 568V621"/><path d="M458 568V621"/><path d="M718 568V621"/><path d="M978 568V621"/><path d="M1238 568V621"/></g>
  <g fill="#fff" stroke="#cfddee">
    <rect x="80" y="636" width="240" height="116" rx="13"/>
    <rect x="340" y="636" width="240" height="116" rx="13"/>
    <rect x="600" y="636" width="240" height="116" rx="13"/>
    <rect x="860" y="636" width="240" height="116" rx="13"/>
    <rect x="1120" y="636" width="240" height="116" rx="13"/>
  </g>
  <g text-anchor="middle">
    <text x="200" y="674" class="label">MySQL</text><text x="200" y="704" class="body">用户 / 知文 / 关系</text><text x="200" y="730" class="small">Outbox / 登录日志</text>
    <text x="460" y="674" class="label">Redis</text><text x="460" y="704" class="body">缓存 / Bitmap / 计数</text><text x="460" y="730" class="small">刷新令牌 / 验证码 / 锁</text>
    <text x="720" y="674" class="label">Elasticsearch</text><text x="720" y="704" class="body">关键词索引 / 向量索引</text><text x="720" y="730" class="small">两个独立索引</text>
    <text x="980" y="674" class="label">阿里云 OSS</text><text x="980" y="704" class="body">Markdown 正文 / 图片</text><text x="980" y="730" class="small">浏览器直接上传</text>
    <text x="1240" y="674" class="label">模型服务</text><text x="1240" y="704" class="body">DeepSeek / DashScope</text><text x="1240" y="730" class="small">对话生成 / Embedding</text>
  </g>

  <text x="82" y="802" class="small">异步派生链路：关系变更写入 Outbox，Canal 读取 binlog，Java 桥接后交给 Kafka 消费者</text>
  <g fill="#edf5ff" stroke="#bcd7ff">
    <rect x="80" y="824" width="270" height="78" rx="11"/>
    <rect x="416" y="824" width="270" height="78" rx="11"/>
    <rect x="752" y="824" width="270" height="78" rx="11"/>
    <rect x="1088" y="824" width="272" height="78" rx="11"/>
  </g>
  <g text-anchor="middle">
    <text x="215" y="855" class="body">MySQL Outbox</text><text x="215" y="882" class="small">与关注主表在同一事务中写入</text>
    <text x="551" y="855" class="body">Canal → Java Bridge</text><text x="551" y="882" class="small">TCP 11111 · 订阅 outbox</text>
    <text x="887" y="855" class="body">Kafka</text><text x="887" y="882" class="small">关系事件主题 canal-outbox</text>
    <text x="1224" y="855" class="body">派生数据消费者</text><text x="1224" y="882" class="small">粉丝表 / 关系列表 / 用户计数</text>
  </g>
  <g class="line"><path d="M350 863H400"/><path d="M686 863H736"/><path d="M1022 863H1072"/></g>
  <text x="82" y="950" class="small">说明：箭头表示源码中的依赖与调用关系；完整服务尚需独立部署与联调。</text>
  <text x="82" y="977" class="small">关键词搜索另有增量消费者；当前知文发布链路尚未写入对应内容 Outbox 事件，详见 README 的能力边界。</text>
</svg>
